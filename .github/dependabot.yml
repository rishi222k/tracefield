version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must match exactly; listed before broader groups
      # because Dependabot assigns each dependency to the first group it matches.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
