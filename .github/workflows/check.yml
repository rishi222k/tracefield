name: Check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The review gate's own tests and the profile's guarded sources. A drifted
      # guard fails here, before any reviewer spends a round on it.
      - run: node --test .github/scripts/validate-review-profile.test.mjs
      - run: node .github/scripts/validate-review-profile.mjs .github/review/tracefield-software-review-v1.json --profile-id tracefield-software
      - run: npm run check

      - run: npm run check:public
